<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Man and The Coins</title>
    <style>
        body {
            background-color: #2b3e23;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 600px;
            padding: 40px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
        h1 {
            color: #ffd700;
            margin-bottom: 10px;
        }
        p {
            color: #dcdcdc;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        .download-btn {
            background-color: #ffd700;
            color: #2b3e23;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s, background-color 0.2s;
            display: inline-block;
        }
        .download-btn:hover {
            background-color: #ffea75;
            transform: scale(1.05);
        }
        .footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #a0a0a0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>The Man and The Coins</h1>
        <p>Explore, collect coins, avoid deadly red spikes, and upgrade your speed in this fast-paced arcade game!</p>
        
        <!-- Replace 'the-man-and-the-coins.exe' with your actual file name or a .zip link -->
        <a href="The Man And The Coins.exe" class="download-btn" download>Download for Windows (.exe)</a>
        
        <div class="footer">
            <p>Requires Windows • Saves progress automatically</p>
        </div>
    </div>

</body>
</html>
